<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Maestro 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Unscheduled / Global Tasks -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Caja de Olvidos</h2>
                <p>Todo lo que no tiene fecha aún.</p>
            </div>
            <div class="input-group">
                <input type="text" id="unscheduled-input" placeholder="Nueva tarea sin fecha..." aria-label="Tarea sin fecha">
                <button id="add-unscheduled-btn">+</button>
            </div>
            <ul id="unscheduled-list" class="task-list">
                <!-- Items added dynamically -->
            </ul>
        </aside>

        <!-- Main Calendar Area -->
        <main class="calendar-container">
            <header class="calendar-header">
                <button id="prev-month" aria-label="Mes anterior">&lt;</button>
                <h1 id="current-month-year">Enero 2026</h1>
                <button id="next-month" aria-label="Siguiente mes">&gt;</button>
                <button id="today-btn">Hoy</button>
            </header>

            <div class="calendar-grid-header">
                <div>Dom</div>
                <div>Lun</div>
                <div>Mar</div>
                <div>Mié</div>
                <div>Jue</div>
                <div>Vie</div>
                <div>Sáb</div>
            </div>

            <div id="calendar-grid" class="calendar-grid">
                <!-- Days generated by JS -->
            </div>
        </main>
    </div>

    <!-- Modal for Daily Tasks -->
    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-date-title">Tareas del día</h2>
                <button id="close-modal" aria-label="Cerrar">&times;</button>
            </div>
            <div class="input-group">
                <input type="text" id="daily-task-input" placeholder="Nueva tarea para hoy..." aria-label="Tarea diaria">
                <button id="add-daily-task-btn">Agregar</button>
            </div>
            <ul id="daily-task-list" class="task-list">
                <!-- Items added dynamically -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
