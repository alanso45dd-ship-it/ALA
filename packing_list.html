<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="packing-list">
        <h1>Packing List</h1>

        <div class="category">
            <h2>Clothes</h2>
            <ul>
                <li><input type="checkbox" id="shirt"><label for="shirt">Shirts</label></li>
                <li><input type="checkbox" id="pants"><label for="pants">Pants</label></li>
                <li><input type="checkbox" id="underwear"><label for="underwear">Underwear</label></li>
                <li><input type="checkbox" id="socks"><label for="socks">Socks</label></li>
            </ul>
        </div>

        <div class="category">
            <h2>Toiletries</h2>
            <ul>
                <li><input type="checkbox" id="toothbrush"><label for="toothbrush">Toothbrush</label></li>
                <li><input type="checkbox" id="toothpaste"><label for="toothpaste">Toothpaste</label></li>
                <li><input type="checkbox" id="shampoo"><label for="shampoo">Shampoo</label></li>
                <li><input type="checkbox" id="soap"><label for="soap">Soap</label></li>
            </ul>
        </div>
    </div>
</body>
</html>
